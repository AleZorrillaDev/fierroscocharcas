name: fierroscocharcas
description: "Aplicación móvil Fierros Cocharcas con login, productos, carrito y perfil usando Firebase Realtime Database."
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.7.0
  firebase_auth: ^5.3.0
  firebase_database: ^11.1.3
  cloud_firestore: ^5.6.12
  cupertino_icons: ^1.0.8
  intl: ^0.18.1
  geolocator: ^13.0.1
  google_maps_flutter: ^2.6.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  fl_chart: ^0.66.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - lib/assets/logo.png
    - lib/assets/banners/
    - lib/assets/marcas/
    - lib/assets/productos/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "lib/assets/logo.png"